name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Git Fetch
        run: git fetch --force --tags

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          sudo wget https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Run Unit Tests
        run: make unit-test

      - name: Cleanup for renovate
        if: startsWith(github.head_ref, 'renovate/')
        run: make renovate-fix

      - name: Save renovate changes
        if: startsWith(github.head_ref, 'renovate/')
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Saving results of scripts/renovate_fix.sh"

      - name: Test build
        run: make build

      - name: Go Snapshot Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --snapshot --clean --skip=publish
